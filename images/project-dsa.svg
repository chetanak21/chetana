<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d5a"/>
      <stop offset="100%" stop-color="#ff8597"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  <circle cx="480" cy="90" r="130" fill="#ff3d5a" opacity="0.07" filter="blur(40px)"/>
  
  <!-- Binary Tree Graph Visualization -->
  <line x1="300" y1="110" x2="210" y2="180" stroke="#ff3d5a" stroke-width="2" opacity="0.5"/>
  <line x1="300" y1="110" x2="390" y2="180" stroke="#ff3d5a" stroke-width="2" opacity="0.5"/>
  <line x1="210" y1="180" x2="150" y2="250" stroke="#ff3d5a" stroke-width="2" opacity="0.3"/>
  <line x1="210" y1="180" x2="260" y2="250" stroke="#ff3d5a" stroke-width="2" opacity="0.3"/>
  <line x1="390" y1="180" x2="340" y2="250" stroke="#ff3d5a" stroke-width="2" opacity="0.3"/>
  <line x1="390" y1="180" x2="440" y2="250" stroke="#ff3d5a" stroke-width="2" opacity="0.3"/>
  
  <!-- Root Node -->
  <circle cx="300" cy="110" r="22" fill="#1e2235" stroke="url(#accentGrad)" stroke-width="3"/>
  <text x="300" y="116" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">root</text>
  
  <!-- Level 1 Nodes -->
  <circle cx="210" cy="180" r="18" fill="#1e2235" stroke="#ff3d5a" stroke-width="2"/>
  <text x="210" y="185" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">L</text>
  <circle cx="390" cy="180" r="18" fill="#1e2235" stroke="#ff3d5a" stroke-width="2"/>
  <text x="390" y="185" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">R</text>
  
  <!-- Level 2 Nodes -->
  <circle cx="150" cy="250" r="14" fill="#161826" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="260" cy="250" r="14" fill="#161826" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="340" cy="250" r="14" fill="#161826" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="440" cy="250" r="14" fill="#161826" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Code Snippet Box -->
  <rect x="50" y="40" width="115" height="28" rx="14" fill="#ff3d5a" fill-opacity="0.15" stroke="#ff3d5a" stroke-opacity="0.4"/>
  <text x="107" y="58" fill="#ff3d5a" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">C &amp; JAVA DSA</text>
  
  <text x="50" y="360" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="18" font-weight="700">DSA &amp; Problem Solving</text>
  <text x="50" y="380" fill="#9da3b4" font-family="'Poppins', sans-serif" font-size="12">Optimized Trees, Graphs, Sorting &amp; Memory Allocation</text>
</svg>

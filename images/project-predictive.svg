<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="coral3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d5a"/>
      <stop offset="100%" stop-color="#ff7b91"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <circle cx="200" cy="180" r="120" fill="#ff3d5a" opacity="0.06" filter="blur(45px)"/>
  
  <!-- Regression Scatter Plot Simulation -->
  <line x1="80" y1="280" x2="520" y2="280" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="80" y2="280" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <!-- Dots -->
  <circle cx="130" cy="250" r="6" fill="#ff3d5a" opacity="0.7"/>
  <circle cx="160" cy="235" r="5" fill="#00d2ff" opacity="0.6"/>
  <circle cx="190" cy="210" r="6" fill="#ff3d5a" opacity="0.9"/>
  <circle cx="220" cy="230" r="5" fill="#00d2ff" opacity="0.8"/>
  <circle cx="250" cy="190" r="7" fill="#ff3d5a"/>
  <circle cx="280" cy="180" r="5" fill="#00d2ff" opacity="0.7"/>
  <circle cx="310" cy="165" r="6" fill="#ff3d5a" opacity="0.8"/>
  <circle cx="350" cy="150" r="7" fill="#00d2ff"/>
  <circle cx="390" cy="130" r="6" fill="#ff3d5a" opacity="0.9"/>
  <circle cx="430" cy="125" r="5" fill="#00d2ff" opacity="0.7"/>
  <circle cx="470" cy="105" r="6" fill="#ff3d5a"/>
  
  <!-- Best Fit Regression Line -->
  <line x1="100" y1="265" x2="490" y2="95" stroke="url(#coral3)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Confidence Interval Band -->
  <path d="M100 280 L490 115 L490 80 L100 245 Z" fill="#ff3d5a" opacity="0.08"/>

  <!-- Badge -->
  <rect x="50" y="35" width="145" height="28" rx="14" fill="#ff3d5a" fill-opacity="0.15" stroke="#ff3d5a" stroke-opacity="0.4"/>
  <text x="122" y="53" fill="#ff3d5a" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PREDICTIVE ML &amp; EDA</text>
  
  <text x="50" y="350" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="18" font-weight="700">Predictive Modeling &amp; EDA</text>
  <text x="50" y="372" fill="#9da3b4" font-family="'Poppins', sans-serif" font-size="12">Scikit-Learn, Pandas, Statistical Analysis &amp; Feature Engineering</text>
</svg>
